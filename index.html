<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blockbuster Cineplexes - Leave Application Form</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; margin: 0; padding: 8px; color: #2d3748; }
    
    .paper { background: #fff; width: 100%; max-width: 650px; margin: 0 auto; padding: 12px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .form-container { width: 100%; border: 1px solid #cbd5e0; padding: 10px; border-radius: 6px; }
    .header { text-align: center; border-bottom: 2px solid #2d3748; padding-bottom: 8px; margin-bottom: 12px; }
    .doc-ref { font-size: 7.5pt; color: #718096; }
    .logo-title { font-size: 18pt; font-weight: 800; color: #1a202c; text-transform: uppercase; margin: 0; }
    .logo-sub { font-size: 8.5pt; font-weight: bold; letter-spacing: 2px; color: #e53e3e; text-transform: uppercase; }
    .form-title { font-size: 10.5pt; font-weight: bold; margin-top: 6px; background: #2d3748; color: #fff; padding: 4px; text-transform: uppercase; letter-spacing: 1px; }
    
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 9pt; font-weight: bold; margin-bottom: 4px; color: #2d3748; }
    
    .row { display: flex; flex-wrap: wrap; gap: 8px; }
    .col { flex: 1; min-width: 140px; }
    
    input[type="text"], input[type="date"], input[type="number"], select, textarea {
        width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 4px; font-size: 9.5pt; font-family: inherit; background: #fff; box-sizing: border-box;
    }
    input:focus, select:focus, textarea:focus { border-color: #3182ce; outline: none; }
    textarea { resize: vertical; min-height: 50px; }
    
    .table-responsive { width: 100%; overflow-x: auto; margin: 10px 0; -webkit-overflow-scrolling: touch; }
    table.leave-table { width: 100%; border-collapse: collapse; min-width: 320px; }
    table.leave-table th, table.leave-table td { border: 1px solid #cbd5e0; padding: 5px 4px; text-align: center; font-size: 8.5pt; }
    table.leave-table th { background: #edf2f7; color: #2d3748; }
    table.leave-table input[type="text"], table.leave-table input[type="date"], table.leave-table input[type="number"] { padding: 4px; font-size: 8pt; }
    
    canvas#sigCanvas { border: 1px dashed #a0aec0; background-color: #f7fafc; cursor: crosshair; touch-action: none; width: 100%; height: 75px; border-radius: 4px; }
    .btn-clear { font-size: 8pt; padding: 4px 8px; background: #e53e3e; color: #fff; border: none; border-radius: 3px; cursor: pointer; margin-top: 4px; font-weight: bold; }
    
    .attached-preview { margin-top: 10px; border: 1px dashed #cbd5e0; padding: 8px; text-align: center; background: #f7fafc; border-radius: 4px; }
    .attached-preview img { max-width: 100%; max-height: 180px; display: none; margin: 6px auto 0 auto; border-radius: 4px; }

    .app-footer { width: 100%; max-width: 650px; margin: 10px auto; background: #fff; padding: 12px; border-radius: 8px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .btn-group { display: flex; gap: 8px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
    .btn { color: white; border: none; padding: 10px 14px; font-size: 9.5pt; font-weight: bold; border-radius: 5px; cursor: pointer; flex: 1; min-width: 140px; }
    .btn-wa { background-color: #25D366; }
    .btn-pdf { background-color: #e53e3e; }

    @media print {
        .app-footer, .btn-clear { display: none !important; }
        .paper { box-shadow: none; padding: 0; }
    }
</style>
</head>
<body>

<div class="paper" id="formPaper">
    <div class="form-container">
        <div class="header">
            <div class="doc-ref">Ref: Blockbuster Cineplexes / HR / 02</div>
            <div class="logo-title">Blockbuster</div>
            <div class="logo-sub">Cineplexes</div>
            <div class="form-title">Leave Application Form</div>
        </div>

        <div class="row">
            <div class="col form-group">
                <label>Branch / Location:</label>
                <select id="cinemaBranch">
                    <option value="Perling Mall">Perling Mall</option>
                    <option value="Pelangi Leisure Mall">Pelangi Leisure Mall</option>
                </select>
            </div>
            <div class="col form-group">
                <label>Application Date:</label>
                <input type="date" id="applyDate">
            </div>
        </div>

        <div class="row">
            <div class="col form-group">
                <label>Staff Name:</label>
                <input type="text" id="staffName" placeholder="Full Name">
            </div>
            <div class="col form-group">
                <label>Employee ID:</label>
                <input type="text" id="staffID" placeholder="e.g. BC-102">
            </div>
        </div>

        <div class="form-group">
            <label>Contact Phone:</label>
            <input type="text" id="telNo" placeholder="e.g. 012-3456789">
        </div>

        <div class="row">
            <div class="col form-group">
                <label>Address While on Leave:</label>
                <textarea id="contactWhileLeave" placeholder="Address during leave"></textarea>
            </div>
            <div class="col form-group">
                <label>Reason for Leave:</label>
                <textarea id="leaveReason" placeholder="Reason"></textarea>
            </div>
        </div>

        <div class="table-responsive">
            <table class="leave-table">
                <thead>
                    <tr>
                        <th style="width: 30%;">TYPE</th>
                        <th>FROM</th>
                        <th>TO</th>
                        <th style="width: 15%;">DAYS</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="text-align: left;"><input type="checkbox" id="annualCb"> Annual</td>
                        <td><input type="date" id="annualFrom"></td>
                        <td><input type="date" id="annualTo"></td>
                        <td><input type="number" id="annualDays"></td>
                    </tr>
                    <tr>
                        <td style="text-align: left;"><input type="checkbox" id="mcCb"> Medical</td>
                        <td><input type="date" id="mcFrom"></td>
                        <td><input type="date" id="mcTo"></td>
                        <td><input type="number" id="mcDays"></td>
                    </tr>
                    <tr>
                        <td style="text-align: left;"><input type="checkbox" id="elCb"> Emergency</td>
                        <td><input type="date" id="elFrom"></td>
                        <td><input type="date" id="elTo"></td>
                        <td><input type="number" id="elDays"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="row">
            <div class="col form-group">
                <label>Signature:</label>
                <canvas id="sigCanvas"></canvas>
                <button type="button" class="btn-clear" onclick="clearSignature()">Clear</button>
            </div>
            <div class="col form-group">
                <label>Re-joining Date:</label>
                <input type="date" id="rejoiningDate">
            </div>
        </div>

        <div class="attached-preview">
            <span id="noFileMsg" style="color:#888; font-size:8pt;">No Document attached.</span>
            <img id="previewImg" src="" alt="Attachment">
        </div>
    </div>
</div>

<div class="app-footer">
    <div style="margin-bottom: 8px;">
        <label style="font-size: 9pt; font-weight: bold;">📎 Attach MC / Document:</label>
        <input type="file" id="fileAttachment" accept="image/*" onchange="previewFile()" style="font-size: 8.5pt; margin-top:4px;">
    </div>

    <div class="btn-group">
        <button class="btn btn-pdf" onclick="generatePDF()">📄 Download PDF</button>
        <button class="btn btn-wa" onclick="sendToCinemaManager()">💬 Send to Manager</button>
    </div>
</div>

<script>
    var canvas = document.getElementById('sigCanvas');
    var ctx = canvas.getContext('2d');
    var isDrawing = false;
    ctx.strokeStyle = "#000080"; ctx.lineWidth = 2;

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth - 2;
        canvas.height = 75;
    }
    window.addEventListener('load', resizeCanvas);

    function getPos(e) {
        var rect = canvas.getBoundingClientRect();
        return { x: (e.clientX || e.touches[0].clientX) - rect.left, y: (e.clientY || e.touches[0].clientY) - rect.top };
    }
    function startDrawing(e) { isDrawing = true; var p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
    function draw(e) { if (!isDrawing) return; e.preventDefault(); var p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }
    function stopDrawing() { isDrawing = false; }

    canvas.addEventListener('mousedown', startDrawing); canvas.addEventListener('mousemove', draw); canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('touchstart', startDrawing); canvas.addEventListener('touchmove', draw); canvas.addEventListener('touchend', stopDrawing);
    function clearSignature() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    function previewFile() {
        var file = document.getElementById('fileAttachment').files[0];
        var previewImg = document.getElementById('previewImg');
        var noFileMsg = document.getElementById('noFileMsg');
        if (file) {
            var reader = new FileReader();
            reader.onload = function(e) { previewImg.src = e.target.result; previewImg.style.display = 'block'; noFileMsg.style.display = 'none'; }
            reader.readAsDataURL(file);
        }
    }

    function generatePDF() {
        var element = document.getElementById('formPaper');
        var name = document.getElementById('staffName').value || 'Staff';
        
        var originalWidth = element.style.width;
        element.style.width = "650px";

        var opt = {
            margin:       [5, 5, 5, 5],
            filename:     'Leave_Form_' + name + '.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true, logging: false },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(function() {
            element.style.width = originalWidth;
        }).catch(function(err) {
            element.style.width = originalWidth;
            alert("PDF Generation Error: " + err);
        });
    }

    function sendToCinemaManager() {
        var cmPhonePerling = "60187795621";   
        var cmPhonePelangi = "601164117015";  

        var branch = document.getElementById('cinemaBranch').value;
        var date = document.getElementById('applyDate').value;
        var name = document.getElementById('staffName').value || 'Staff';
        var id = document.getElementById('staffID').value || 'N/A';
        var tel = document.getElementById('telNo').value || 'N/A';
        var addr = document.getElementById('contactWhileLeave').value || 'N/A';
        var reason = document.getElementById('leaveReason').value || 'N/A';
        var rejoining = document.getElementById('rejoiningDate').value || 'N/A';

        var al = document.getElementById('annualCb').checked ? (document.getElementById('annualFrom').value + '~' + document.getElementById('annualTo').value + '~' + document.getElementById('annualDays').value) : '';
        var mc = document.getElementById('mcCb').checked ? (document.getElementById('mcFrom').value + '~' + document.getElementById('mcTo').value + '~' + document.getElementById('mcDays').value) : '';
        var el = document.getElementById('elCb').checked ? (document.getElementById('elFrom').value + '~' + document.getElementById('elTo').value + '~' + document.getElementById('elDays').value) : '';

        var targetPhone = (branch === "Perling Mall") ? cmPhonePerling : cmPhonePelangi;
        
        var queryParams = "?role=cm" +
            "&staff=" + encodeURIComponent(name) +
            "&branch=" + encodeURIComponent(branch) +
            "&date=" + encodeURIComponent(date) +
            "&id=" + encodeURIComponent(id) +
            "&tel=" + encodeURIComponent(tel) +
            "&addr=" + encodeURIComponent(addr) +
            "&reason=" + encodeURIComponent(reason) +
            "&rejoining=" + encodeURIComponent(rejoining) +
            "&al=" + encodeURIComponent(al) +
            "&mc=" + encodeURIComponent(mc) +
            "&el=" + encodeURIComponent(el);

        var statusLink = "https://george191919.github.io/leave-application/status.html" + queryParams;

        generatePDF();

        var message = "NEW LEAVE APPLICATION (" + branch.toUpperCase() + ")\n\n" +
                      "• Branch: " + branch + "\n" +
                      "• Staff: " + name + "\n" +
                      "• ID: " + id + "\n" +
                      "• Reason: " + reason + "\n\n" +
                      "------------------------------------\n" +
                      "CINEMA MANAGER ACTION & PDF LINK:\n" +
                      statusLink;

        var whatsappUrl = "https://api.whatsapp.com/send?phone=" + targetPhone + "&text=" + encodeURIComponent(message);

        setTimeout(function() {
            window.open(whatsappUrl, '_blank');
        }, 1200);
    }
</script>
</body>
</html>
