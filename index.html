<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blockbuster Cineplexes - Leave Application Form</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; margin: 0; padding: 12px 8px; color: #f8fafc; }
    
    .paper { background: #1e293b; width: 100%; max-width: 650px; margin: 0 auto; padding: 16px; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); border: 1px solid #334155; }
    .form-container { width: 100%; border: 1px solid #475569; padding: 12px; border-radius: 8px; background: #0f172a; }
    .header { text-align: center; border-bottom: 2px solid #3b82f6; padding-bottom: 10px; margin-bottom: 14px; }
    .doc-ref { font-size: 7.5pt; color: #94a3b8; }
    .logo-title { font-size: 20pt; font-weight: 800; color: #38bdf8; text-transform: uppercase; margin: 0; letter-spacing: 1px; }
    .logo-sub { font-size: 8.5pt; font-weight: bold; letter-spacing: 2px; color: #ef4444; text-transform: uppercase; }
    .form-title { font-size: 11pt; font-weight: bold; margin-top: 8px; background: #1e293b; color: #f8fafc; padding: 6px; text-transform: uppercase; letter-spacing: 1px; border-radius: 4px; border: 1px solid #334155; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 8.5pt; font-weight: 600; margin-bottom: 5px; color: #cbd5e1; }
    
    .row { display: flex; flex-wrap: wrap; gap: 10px; }
    .col { flex: 1; min-width: 140px; }
    
    input[type="text"], input[type="date"], input[type="number"], select, textarea {
        width: 100%; padding: 10px; border: 1px solid #334155; border-radius: 6px; font-size: 9.5pt; font-family: inherit; background: #1e293b; color: #f8fafc; box-sizing: border-box; transition: all 0.2s;
    }
    input:focus, select:focus, textarea:focus { border-color: #38bdf8; outline: none; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
    textarea { resize: vertical; min-height: 50px; }
    
    .table-responsive { width: 100%; overflow-x: auto; margin: 12px 0; -webkit-overflow-scrolling: touch; }
    table.leave-table, table.approved-table { width: 100%; border-collapse: collapse; min-width: 320px; }
    table.leave-table th, table.leave-table td, table.approved-table th, table.approved-table td { border: 1px solid #334155; padding: 6px 4px; text-align: center; font-size: 8.5pt; }
    table.leave-table th, table.approved-table th { background: #1e293b; color: #38bdf8; font-weight: bold; }
    
    canvas#sigCanvas { border: 1px dashed #64748b; background-color: #1e293b; cursor: crosshair; touch-action: none; width: 100%; height: 80px; border-radius: 6px; }
    .btn-clear { font-size: 8pt; padding: 4px 10px; background: #ef4444; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin-top: 4px; font-weight: bold; }
    
    .attached-preview { margin-top: 10px; border: 1px dashed #475569; padding: 8px; text-align: center; background: #1e293b; border-radius: 6px; }
    .attached-preview img { max-width: 100%; max-height: 180px; display: none; margin: 6px auto 0 auto; border-radius: 4px; }

    .approved-section { margin-top: 15px; border-top: 2px dashed #3b82f6; padding-top: 10px; text-align: left; }
    .approved-title { font-size: 9.5pt; font-weight: bold; color: #22c55e; margin-bottom: 8px; text-transform: uppercase; }

    .app-footer { width: 100%; max-width: 650px; margin: 14px auto; background: #1e293b; padding: 14px; border-radius: 12px; text-align: center; border: 1px solid #334155; }
    .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
    .btn { color: white; border: none; padding: 12px 16px; font-size: 9.5pt; font-weight: bold; border-radius: 6px; cursor: pointer; flex: 1; min-width: 140px; transition: transform 0.1s; }
    .btn:active { transform: scale(0.98); }
    .btn-wa { background-color: #22c55e; }
    .btn-pdf { background-color: #ef4444; }

    @media print {
        .app-footer, .btn-clear, .approved-section { display: none !important; }
        .paper { box-shadow: none; padding: 0; background: #fff; color: #000; }
        .form-container { background: #fff; border-color: #000; }
        input, select, textarea { background: #fff !important; color: #000 !important; border-color: #ccc !important; }
    }
</style>
</head>
<body>

<div class="paper" id="formPaper">
    <div class="form-container">
        <div class="header">
            <div class="doc-ref">Ref: Blockbuster Cineplexes / HR / 02</div>
            <div class="logo-title">Blockbuster</div>
            <div class="logo-sub">Cineplexes</div>
            <div class="form-title">Leave Application Form</div>
        </div>

        <div class="row">
            <div class="col form-group">
                <label>Branch / Location:</label>
                <select id="cinemaBranch" onchange="updateStaffList()">
                    <option value="Perling Mall">Perling Mall</option>
                    <option value="Pelangi Leisure Mall">Pelangi Leisure Mall</option>
                </select>
            </div>
            <div class="col form-group">
                <label>Application Date:</label>
                <input type="date" id="applyDate">
            </div>
        </div>

        <div class="row">
            <div class="col form-group">
                <label>Select Staff Name:</label>
                <select id="staffName" onchange="autoFillStaffID()">
                    <option value="">-- Select Staff --</option>
                </select>
            </div>
            <div class="col form-group">
                <label>Employee ID:</label>
                <input type="text" id="staffID" readonly placeholder="Auto-filled">
            </div>
        </div>

        <div class="form-group">
            <label>Contact Phone:</label>
            <input type="text" id="telNo" placeholder="e.g. 012-3456789">
        </div>

        <div class="row">
            <div class="col form-group">
                <label>Address While on Leave:</label>
                <textarea id="contactWhileLeave" placeholder="Address during leave"></textarea>
            </div>
            <div class="col form-group">
                <label>Reason for Leave:</label>
                <textarea id="leaveReason" placeholder="Reason"></textarea>
            </div>
        </div>

        <div class="table-responsive">
            <table class="leave-table">
                <thead>
                    <tr>
                        <th style="width: 28%;">TYPE</th>
                        <th>FROM</th>
                        <th>TO</th>
                        <th style="width: 18%;">DAYS</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="text-align: left;"><input type="checkbox" id="annualCb"> Annual</td>
                        <td><input type="date" id="annualFrom" onchange="calculateDays('annual')"></td>
                        <td><input type="date" id="annualTo" onchange="calculateDays('annual')"></td>
                        <td><input type="number" id="annualDays" readonly placeholder="0"></td>
                    </tr>
                    <tr>
                        <td style="text-align: left;"><input type="checkbox" id="mcCb"> Medical</td>
                        <td><input type="date" id="mcFrom" onchange="calculateDays('mc')"></td>
                        <td><input type="date" id="mcTo" onchange="calculateDays('mc')"></td>
                        <td><input type="number" id="mcDays" readonly placeholder="0"></td>
                    </tr>
                    <tr>
                        <td style="text-align: left;"><input type="checkbox" id="elCb"> Emergency</td>
                        <td><input type="date" id="elFrom" onchange="calculateDays('el')"></td>
                        <td><input type="date" id="elTo" onchange="calculateDays('el')"></td>
                        <td><input type="number" id="elDays" readonly placeholder="0"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="row">
            <div class="col form-group">
                <label>Signature:</label>
                <canvas id="sigCanvas"></canvas>
                <button type="button" class="btn-clear" onclick="clearSignature()">Clear</button>
            </div>
            <div class="col form-group">
                <label>Re-joining Date:</label>
                <input type="date" id="rejoiningDate">
            </div>
        </div>

        <div class="attached-preview">
            <span id="noFileMsg" style="color:#94a3b8; font-size:8pt;">No Document attached.</span>
            <img id="previewImg" src="" alt="Attachment">
        </div>

        <!-- Approved Leave History Section -->
        <div class="approved-section">
            <div class="approved-title">✅ Approved Leave Schedule</div>
            <div class="table-responsive">
                <table class="approved-table">
                    <thead>
                        <tr>
                            <th>Staff Name</th>
                            <th>Leave Dates</th>
                            <th>Type</th>
                        </tr>
                    </thead>
                    <tbody id="approvedTableBody">
                        <tr><td colspan="3" style="color:#94a3b8;">No approved leaves recorded.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="app-footer">
    <div style="margin-bottom: 8px;">
        <label style="font-size: 8.5pt; font-weight: bold; color: #cbd5e1;">📎 Attach MC / Document:</label>
        <input type="file" id="fileAttachment" accept="image/*" onchange="previewFile()" style="font-size: 8.5pt; margin-top:4px; color: #94a3b8;">
    </div>

    <div class="btn-group">
        <button class="btn btn-pdf" onclick="generatePDF()">📄 Download PDF</button>
        <button class="btn btn-wa" onclick="sendToCinemaManager()">💬 Send to Manager</button>
    </div>
</div>

<script>
    const staffDatabase = {
        "Perling Mall": [
            { id: "1", name: "Ainaa" },
            { id: "2", name: "Haldi" },
            { id: "3", name: "George" },
            { id: "4", name: "Sharrvin" },
            { id: "5", name: "Jayanath" },
            { id: "6", name: "Perry" },
            { id: "7", name: "Kumar" },
            { id: "8", name: "Alin" },
            { id: "9", name: "Bella" },
            { id: "10", name: "Maha" },
            { id: "11", name: "Rafie" },
            { id: "12", name: "Ran(PT)" }
        ],
        "Pelangi Leisure Mall": [
            { id: "1", name: "Kimi" },
            { id: "2", name: "Lala" },
            { id: "3", name: "Krish" },
            { id: "4", name: "Suha" },
            { id: "5", name: "Atul" }
        ]
    };

    function updateStaffList() {
        var branch = document.getElementById('cinemaBranch').value;
        var staffSelect = document.getElementById('staffName');
        staffSelect.innerHTML = '<option value="">-- Select Staff --</option>';
        
        if (staffDatabase[branch]) {
            staffDatabase[branch].forEach(function(staff) {
                var opt = document.createElement('option');
                opt.value = staff.name;
                opt.setAttribute('data-id', staff.id);
                opt.innerText = staff.name + " (ID: " + staff.id + ")";
                staffSelect.appendChild(opt);
            });
        }
        document.getElementById('staffID').value = '';
    }

    function autoFillStaffID() {
        var staffSelect = document.getElementById('staffName');
        var selectedOpt = staffSelect.options[staffSelect.selectedIndex];
        var staffID = selectedOpt.getAttribute('data-id') || '';
        document.getElementById('staffID').value = staffID;
    }

    var canvas = document.getElementById('sigCanvas');
    var ctx = canvas.getContext('2d');
    var isDrawing = false;
    ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2;

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth - 2;
        canvas.height = 80;
    }

    window.addEventListener('load', function() {
        resizeCanvas();
        document.getElementById('applyDate').valueAsDate = new Date();
        updateStaffList();
        loadApprovedLeaves();
    });

    function getPos(e) {
        var rect = canvas.getBoundingClientRect();
        return { x: (e.clientX || e.touches[0].clientX) - rect.left, y: (e.clientY || e.touches[0].clientY) - rect.top };
    }
    function startDrawing(e) { isDrawing = true; var p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
    function draw(e) { if (!isDrawing) return; e.preventDefault(); var p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }
    function stopDrawing() { isDrawing = false; }

    canvas.addEventListener('mousedown', startDrawing); canvas.addEventListener('mousemove', draw); canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('touchstart', startDrawing); canvas.addEventListener('touchmove', draw); canvas.addEventListener('touchend', stopDrawing);
    function clearSignature() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    function previewFile() {
        var file = document.getElementById('fileAttachment').files[0];
        var previewImg = document.getElementById('previewImg');
        var noFileMsg = document.getElementById('noFileMsg');
        if (file) {
            var reader = new FileReader();
            reader.onload = function(e) { previewImg.src = e.target.result; previewImg.style.display = 'block'; noFileMsg.style.display = 'none'; }
            reader.readAsDataURL(file);
        }
    }

    function calculateDays(prefix) {
        var fromVal = document.getElementById(prefix + 'From').value;
        var toVal = document.getElementById(prefix + 'To').value;
        var cb = document.getElementById(prefix + 'Cb');
        var daysInput = document.getElementById(prefix + 'Days');

        if (fromVal && toVal) {
            var d1 = new Date(fromVal);
            var d2 = new Date(toVal);
            var diffTime = d2.getTime() - d1.getTime();
            var diffDays = Math.ceil(diffTime / (1000 * 3600 * 24)) + 1;

            if (diffDays > 0) {
                daysInput.value = diffDays;
                cb.checked = true;
            } else {
                daysInput.value = '';
                cb.checked = false;
            }
        }
    }

    function loadApprovedLeaves() {
        var approvedList = JSON.parse(localStorage.getItem('approvedLeaves') || '[]');
        var tbody = document.getElementById('approvedTableBody');
        if (approvedList.length > 0) {
            tbody.innerHTML = '';
            approvedList.forEach(function(item) {
                tbody.innerHTML += `<tr>
                    <td><b>${item.staff}</b> (${item.branch})</td>
                    <td>${item.dates}</td>
                    <td><span style="color:#22c55e; font-weight:bold;">${item.type}</span></td>
                </tr>`;
            });
        }
    }

    function generatePDF() {
        var element = document.getElementById('formPaper');
        var name = document.getElementById('staffName').value || 'Staff';
        var originalWidth = element.style.width;
        element.style.width = "650px";

        var opt = {
            margin:       [5, 5, 5, 5],
            filename:     'Leave_Form_' + name + '.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true, logging: false },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(function() {
            element.style.width = originalWidth;
        }).catch(function(err) {
            element.style.width = originalWidth;
            alert("PDF Generation Error: " + err);
        });
    }

    function sendToCinemaManager() {
        var cmPhonePerling = "60187795621";   
        var cmPhonePelangi = "601164117015";  

        var branch = document.getElementById('cinemaBranch').value;
        var date = document.getElementById('applyDate').value;
        var name = document.getElementById('staffName').value || 'Staff';
        var id = document.getElementById('staffID').value || 'N/A';
        var tel = document.getElementById('telNo').value || 'N/A';
        var addr = document.getElementById('contactWhileLeave').value || 'N/A';
        var reason = document.getElementById('leaveReason').value || 'N/A';
        var rejoining = document.getElementById('rejoiningDate').value || 'N/A';

        var alStr = '', mcStr = '', elStr = '', leaveSummary = [];
        if(document.getElementById('annualCb').checked) {
            var f = document.getElementById('annualFrom').value, t = document.getElementById('annualTo').value, d = document.getElementById('annualDays').value;
            alStr = f + '~' + t + '~' + d;
            leaveSummary.push("Annual: " + f + " to " + t + " (" + d + " days)");
        }
        if(document.getElementById('mcCb').checked) {
            var f = document.getElementById('mcFrom').value, t = document.getElementById('mcTo').value, d = document.getElementById('mcDays').value;
            mcStr = f + '~' + t + '~' + d;
            leaveSummary.push("Medical: " + f + " to " + t + " (" + d + " days)");
        }
        if(document.getElementById('elCb').checked) {
            var f = document.getElementById('elFrom').value, t = document.getElementById('elTo').value, d = document.getElementById('elDays').value;
            elStr = f + '~' + t + '~' + d;
            leaveSummary.push("Emergency: " + f + " to " + t + " (" + d + " days)");
        }

        var targetPhone = (branch === "Perling Mall") ? cmPhonePerling : cmPhonePelangi;
        
        var queryParams = "?role=cm" +
            "&staff=" + encodeURIComponent(name) +
            "&branch=" + encodeURIComponent(branch) +
            "&date=" + encodeURIComponent(date) +
            "&id=" + encodeURIComponent(id) +
            "&tel=" + encodeURIComponent(tel) +
            "&addr=" + encodeURIComponent(addr) +
            "&reason=" + encodeURIComponent(reason) +
            "&rejoining=" + encodeURIComponent(rejoining) +
            "&al=" + encodeURIComponent(alStr) +
            "&mc=" + encodeURIComponent(mcStr) +
            "&el=" + encodeURIComponent(elStr);

        var statusLink = "https://george191919.github.io/leave-application/status.html" + queryParams;

        generatePDF();

        var message = "📋 *NEW LEAVE APPLICATION*\n" +
                      "------------------------------------\n" +
                      "🏢 *Branch:* " + branch + "\n" +
                      "👤 *Staff:* " + name + " (ID: " + id + ")\n" +
                      "📅 *Applied Date:* " + date + "\n" +
                      "📝 *Reason:* " + reason + "\n\n" +
                      "📌 *Leave Dates:*\n" + (leaveSummary.join("\n") || "Not specified") + "\n\n" +
                      "🔄 *Re-joining Date:* " + rejoining + "\n" +
                      "------------------------------------\n" +
                      "🔗 *CLICK LINK TO REVIEW & APPROVE:*\n" + statusLink;

        var whatsappUrl = "https://api.whatsapp.com/send?phone=" + targetPhone + "&text=" + encodeURIComponent(message);

        setTimeout(function() {
            window.open(whatsappUrl, '_blank');
        }, 1200);
    }
</script>
</body>
</html>
