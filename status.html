<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Management Portal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 20px 10px; background: #0f172a; color: #f8fafc; margin: 0; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px 16px; max-width: 440px; margin: 0 auto; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); border: 1px solid #334155; box-sizing: border-box; }
        .title { font-size: 15pt; font-weight: bold; color: #38bdf8; text-transform: uppercase; margin-bottom: 4px; }
        .subtitle { font-size: 8.5pt; color: #94a3b8; margin-bottom: 16px; }
        
        .info-box { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 14px; text-align: left; margin-bottom: 16px; font-size: 9pt; color: #cbd5e1; line-height: 1.6; }
        
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        .btn { display: block; padding: 12px; text-decoration: none; font-weight: bold; border-radius: 6px; font-size: 9.5pt; color: white; border: none; cursor: pointer; text-align: center; transition: transform 0.1s; }
        .btn:active { transform: scale(0.98); }
        
        .btn-pdf-dl { background-color: #8b5cf6; }
        .btn-approve { background-color: #22c55e; }
        .btn-forward { background-color: #3b82f6; }
        .btn-reject { background-color: #ef4444; }

        #pdfRenderPaper { display: none; text-align: left; background: #fff; color: #000; padding: 15px; border: 1.5px solid #2d3748; font-size: 9pt; line-height: 1.4; }
        #pdfRenderPaper table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        #pdfRenderPaper th, #pdfRenderPaper td { border: 1px solid #cbd5e0; padding: 6px; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <div class="title">Blockbuster Cineplexes</div>
    <div class="subtitle">Leave Approval & Review Portal</div>

    <div class="info-box">
        <b>Staff Name:</b> <span id="dispStaff">-</span><br>
        <b>Branch:</b> <span id="dispBranch">-</span><br>
        <b>Application Date:</b> <span id="dispDate">-</span><br>
        <b>Reason:</b> <span id="dispReason">-</span><br>
        <b>Portal Access:</b> <span id="dispRole" style="color: #38bdf8; font-weight: bold;">-</span>
    </div>

    <div id="actionArea" class="btn-group">
        <!-- Action Buttons -->
    </div>
</div>

<div id="pdfRenderPaper">
    <div style="text-align: center; border-bottom: 2px solid #2d3748; padding-bottom: 8px; margin-bottom: 12px;">
        <h3 style="margin:0; font-size: 16pt; text-transform: uppercase;">Blockbuster Cineplexes</h3>
        <h5 style="margin:0; color: #e53e3e; letter-spacing: 1px;">LEAVE APPLICATION FORM</h5>
    </div>
    <p><b>Branch:</b> <span id="pdfBranch"></span> | <b>Date:</b> <span id="pdfDate"></span></p>
    <p><b>Staff Name:</b> <span id="pdfStaff"></span> | <b>ID:</b> <span id="pdfID"></span></p>
    <p><b>Contact No:</b> <span id="pdfTel"></span></p>
    <p><b>Address While Leave:</b> <span id="pdfAddr"></span></p>
    <p><b>Reason:</b> <span id="pdfReason"></span></p>
    
    <table>
        <thead>
            <tr>
                <th>Type</th>
                <th>From</th>
                <th>To</th>
                <th>Days</th>
            </tr>
        </thead>
        <tbody id="pdfTableBody"></tbody>
    </table>
    
    <p style="margin-top: 12px;"><b>Re-joining Date:</b> <span id="pdfRejoining"></span></p>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const role = (urlParams.get('role') || 'cm').toLowerCase();
    const staff = urlParams.get('staff') || 'Staff';
    const branch = urlParams.get('branch') || 'Cineplex';
    const date = urlParams.get('date') || '-';
    const id = urlParams.get('id') || '-';
    const tel = urlParams.get('tel') || '-';
    const addr = urlParams.get('addr') || '-';
    const reason = urlParams.get('reason') || '-';
    const rejoining = urlParams.get('rejoining') || '-';
    
    const al = urlParams.get('al') || '';
    const mc = urlParams.get('mc') || '';
    const el = urlParams.get('el') || '';

    const gmPhone = "601116316020"; 
    const githubBaseUrl = "https://george191919.github.io/leave-application/status.html";

    document.getElementById('dispStaff').innerText = staff + " (ID: " + id + ")";
    document.getElementById('dispBranch').innerText = branch;
    document.getElementById('dispDate').innerText = date;
    document.getElementById('dispReason').innerText = reason;
    document.getElementById('dispRole').innerText = (role === 'gm') ? "General Manager / HR" : "Cinema Manager";

    document.getElementById('pdfBranch').innerText = branch;
    document.getElementById('pdfDate').innerText = date;
    document.getElementById('pdfStaff').innerText = staff;
    document.getElementById('pdfID').innerText = id;
    document.getElementById('pdfTel').innerText = tel;
    document.getElementById('pdfAddr').innerText = addr;
    document.getElementById('pdfReason').innerText = reason;
    document.getElementById('pdfRejoining').innerText = rejoining;

    var tbody = document.getElementById('pdfTableBody');
    tbody.innerHTML = '';
    
    var leaveDatesSummary = '';
    var leaveTypeSummary = '';

    function addRow(type, val) {
        if(val) {
            var parts = val.split('~');
            tbody.innerHTML += `<tr><td>${type}</td><td>${parts[0] || '-'}</td><td>${parts[1] || '-'}</td><td>${parts[2] || '-'}</td></tr>`;
            leaveDatesSummary = (parts[0] || '') + ' to ' + (parts[1] || '');
            leaveTypeSummary = type;
        }
    }
    addRow('Annual Leave', al);
    addRow('Medical Leave', mc);
    addRow('Emergency Leave', el);
    if(!al && !mc && !el) {
        tbody.innerHTML = '<tr><td colspan="4">No leave details provided.</td></tr>';
    }

    function saveApprovedLeaveToStorage() {
        var approvedList = JSON.parse(localStorage.getItem('approvedLeaves') || '[]');
        approvedList.push({
            staff: staff,
            branch: branch,
            dates: leaveDatesSummary || 'N/A',
            type: leaveTypeSummary || 'Leave'
        });
        localStorage.setItem('approvedLeaves', JSON.stringify(approvedList));
    }

    function downloadFilledPDF() {
        var element = document.getElementById('pdfRenderPaper');
        element.style.display = 'block';
        element.style.width = "650px";

        var opt = {
            margin:       [8, 8, 8, 8],
            filename:     'Completed_Leave_Form_' + staff + '.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true, logging: false },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(function() {
            element.style.display = 'none';
            element.style.width = "auto";
        }).catch(function(err) {
            element.style.display = 'none';
            element.style.width = "auto";
            alert("PDF Download Error: " + err);
        });
    }

    function handleRejection(approverRole) {
        var rejectReason = prompt("Please enter reason for rejection (நிராகரிப்பதற்கான காரணத்தை உள்ளிடவும்):");
        if (rejectReason !== null && rejectReason.trim() !== "") {
            var msg = "Hello " + staff + ", your leave request for " + branch + " has been REJECTED by " + approverRole + ".\n\n❌ *Reason:* " + rejectReason;
            window.location.href = "https://api.whatsapp.com/send?text=" + encodeURIComponent(msg);
        }
    }

    var actionArea = document.getElementById('actionArea');

    if (role === 'cm') {
        var currentParams = window.location.search.replace('role=cm', 'role=gm');
        var gmLink = githubBaseUrl + currentParams;
        
        var approveStaffMsg = "Hello " + staff + ", your leave request for " + branch + " has been APPROVED by Cinema Manager. ✅";
        
        var gmMessage = "📋 *LEAVE APPLICATION (FORWARDED BY CM)*\n" +
                        "------------------------------------\n" +
                        "🏢 *Branch:* " + branch + "\n" +
                        "👤 *Staff:* " + staff + " (ID: " + id + ")\n" +
                        "👍 *CM Recommendation:* RECOMMENDED / APPROVED ✅\n\n" +
                        "🔗 *GM / HR APPROVAL LINK:*\n" + gmLink;

        actionArea.innerHTML = `
            <button class="btn btn-pdf-dl" onclick="downloadFilledPDF()">
                📥 Download Completed Staff PDF
            </button>
            <button class="btn btn-approve" onclick="saveApprovedLeaveToStorage(); window.location.href='https://api.whatsapp.com/send?text=${encodeURIComponent(approveStaffMsg)}';">
                ✅ Approved - Send to Staff
            </button>
            <a class="btn btn-forward" href="https://api.whatsapp.com/send?phone=${gmPhone}&text=${encodeURIComponent(gmMessage)}">
                📲 Send Application to GM
            </a>
            <button class="btn btn-reject" onclick="handleRejection('Cinema Manager')">
                ❌ Reject Request
            </button>
        `;
    } else if (role === 'gm') {
        var finalApproveMsg = "Hello " + staff + ", your leave application for " + branch + " has received FINAL APPROVAL from General Manager / HR. ✅";

        actionArea.innerHTML = `
            <button class="btn btn-pdf-dl" onclick="downloadFilledPDF()">
                📥 Download Completed Staff PDF
            </button>
            <button class="btn btn-approve" onclick="saveApprovedLeaveToStorage(); window.location.href='https://api.whatsapp.com/send?text=${encodeURIComponent(finalApproveMsg)}';">
                ✅ Final Approve
            </button>
            <button class="btn btn-reject" onclick="handleRejection('General Manager / HR')">
                ❌ Reject Request
            </button>
        `;
    }
</script>

</body>
</html>
